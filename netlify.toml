[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.9.0"

# Protect the two metered AI endpoints from accidental or abusive bursts.
# Netlify applies these limits at the edge, before the Next.js handlers run.
[[redirects]]
  from = "/api/coach"
  to = "/api/coach"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 30
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/getChat"
  to = "/api/getChat"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 12
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/getSources"
  to = "/api/getSources"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 20
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/mental-health/respond"
  to = "/api/mental-health/respond"
  status = 200
  force = true

  [redirects.rate_limit]
    # The live caller seat calls this once per caller turn, so a bounded
    # six-turn conversation plus its decision trace is seven requests. This
    # permits three live calls per minute while still bounding the classifier.
    window_limit = 24
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/mental-health/speech"
  to = "/api/mental-health/speech"
  status = 200
  force = true

  [redirects.rate_limit]
    # A complete simulated case uses up to nine requests; a live call adds one
    # reviewed reply per caller turn. This permits three demonstrations per
    # minute while bounding metered provider traffic.
    window_limit = 45
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/mental-health/transcribe"
  to = "/api/mental-health/transcribe"
  status = 200
  force = true

  [redirects.rate_limit]
    # One request per live caller turn, bounded well under a runaway loop.
    window_limit = 24
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/mental-health/voice-turn"
  to = "/api/mental-health/voice-turn"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 24
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/mental-health/voice-session"
  to = "/api/mental-health/voice-session"
  status = 200
  force = true

  [redirects.rate_limit]
    window_limit = 12
    window_size = 60
    aggregate_by = ["ip", "domain"]
