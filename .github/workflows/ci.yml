name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"

      - name: Voice worker checks
        working-directory: voice-worker
        run: |
          uv sync --frozen
          cd /tmp
          PYTHONPATH="${GITHUB_WORKSPACE}/voice-worker" \
            "${GITHUB_WORKSPACE}/voice-worker/.venv/bin/python" -P \
            -m unittest discover -v -s "${GITHUB_WORKSPACE}/voice-worker" -p 'test_*.py'

      - name: Voice worker image
        run: docker build -f voice-worker/Dockerfile voice-worker

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Acceptance tests
        run: pnpm test:e2e

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: output/
          if-no-files-found: ignore
