name: Deploy voice worker

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.resolve.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "image_tag=ghcr.io/${repository}/voice:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - id: existing
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          if docker buildx imagetools inspect "${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        with:
          context: voice-worker
          file: voice-worker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image_tag }}
          cache-from: type=gha,scope=voice-worker
          cache-to: type=gha,mode=max,scope=voice-worker
      - id: resolve
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          repository="${GITHUB_REPOSITORY,,}"
          echo "image_ref=ghcr.io/${repository}/voice@${digest}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      TARGET: ${{ inputs.target }}
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DROPLET_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${DROPLET_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
      - name: Install and deploy
        run: |
          ssh "${DROPLET_USER}@${DROPLET_HOST}" "install -d -m 755 /opt/llamatutor"
          scp deploy/compose.yml deploy/deploy-voice.sh \
            "${DROPLET_USER}@${DROPLET_HOST}:/opt/llamatutor/"
          ssh "${DROPLET_USER}@${DROPLET_HOST}" \
            "chmod 755 /opt/llamatutor/deploy-voice.sh && /opt/llamatutor/deploy-voice.sh '${TARGET}' '${IMAGE_REF}'"
