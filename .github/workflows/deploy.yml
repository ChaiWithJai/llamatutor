name: Build and deploy to Droplet (fallback)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "image_ref=ghcr.io/${repository}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      TARGET: ${{ inputs.target }}
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DROPLET_SSH_KEY}" > "${HOME}/.ssh/id_ed25519"
          chmod 600 "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${DROPLET_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"

      - name: Install deployment files
        shell: bash
        run: |
          ssh "${DROPLET_USER}@${DROPLET_HOST}" "install -d -m 755 /opt/llamatutor"
          scp deploy/compose.yml deploy/deploy.sh \
            "${DROPLET_USER}@${DROPLET_HOST}:/opt/llamatutor/"

      - name: Deploy with health-check rollback
        shell: bash
        run: |
          ssh "${DROPLET_USER}@${DROPLET_HOST}" \
            "chmod 755 /opt/llamatutor/deploy.sh && /opt/llamatutor/deploy.sh '${TARGET}' '${IMAGE_REF}'"
